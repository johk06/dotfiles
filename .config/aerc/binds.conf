# Binds are of the form <key sequence> = <command to run>
# To use '=' in a key sequence, substitute it with "Eq": "<Ctrl+Eq>"
# If you wish to bind #, you can wrap the key sequence in quotes: "#" = quit

# Sections {{{
H = :prev-tab<Enter>
L = :next-tab<Enter>
<C-t> = :term<Enter>
? = :help keys<Enter>
q = :choose -o y 'Quit' quit<Enter>
<C-z> = :suspend<Enter>
J = :next-folder<Enter>
K = :prev-folder<Enter>
{ = :collapse-folder<Enter>
} = :expand-folder<Enter>
<C-r> = :check-mail<Enter>

ci = :cf INBOX<Enter>
ca = :cf Archive<Enter>
# }}}

[messages]
q = :quit<Enter>

# Navigation {{{
j = :next<Enter>
<Down> = :next<Enter>
<C-d> = :next 50%<Enter>
<C-f> = :next 100%<Enter>

k = :prev<Enter>
<Up> = :prev<Enter>
<C-u> = :prev 50%<Enter>

g = :select 0<Enter>
G = :select -1<Enter>
# }}}

# Marking {{{
v = :mark -t<Enter>
V = :mark -v<Enter>
a = :mark -at<Enter>
A = :mark -a<Space>
<Space> = :mark -t<Enter>:next<Enter>
# }}}

# Threads {{{
T = :fold -a<Enter>:toggle-threads<Enter>
h = :fold<Enter>
l = :unfold<Enter>
za = :fold -t<Enter>
zm = :fold -a<Enter>
zr = :unfold -a<Enter>
<tab> = :fold -t<Enter>
# }}}

zz = :align center<Enter>
zt = :align top<Enter>
zb = :align bottom<Enter>

<Enter> = :view<Enter>
d = :choose -o y 'Really delete this message' delete-message<Enter>
# A = :unmark -a<Enter>:mark -T<Enter>:archive flat<Enter>

# [w]rite
w = :compose<Enter>
W = :compose -e<Enter>

# Mark/Flag, also Move {{{
mu = :unread<Enter>
mr = :read<Enter>
ma = :flag -ta<Enter>
ms = :flag -tx seen<Enter>
mf = :flag -tx forwarded<Enter>
mi = :flag -tx flagged<Enter>
md = :flag -tx draft<Enter>
ma = :archive flat<Enter>
mt = :mark -T<Enter>
# }}}

# Reply {{{
r = :reply -a<Enter>
F = :forward<Enter>
Rb = :bounce<space>
Rr = :reply<Enter>
Rq = :reply -aq<Enter>
# }}}

# Externals {{{
! = :term<space>
| = :pipe<space>
# }}}

# Search and Sorting {{{
/ = :search<space>
f = :filter<space>
n = :next-result<Enter>
N = :prev-result<Enter>
<Esc> = :clear<Enter>
<C-l> = :clear<Enter>

sd = :sort -r date<Enter>:select 0<Enter>
sr = :sort -r arrival<Enter>:select 0<Enter>
su = :sort size<Enter>:select 0<Enter>
sf = :sort from<Enter>:select 0<Enter>
st = :sort to<Enter>:select 0<Enter>
ss = :sort subject<Enter>:select 0<Enter>
sc = :sort cc<Enter>:select 0<Enter>
# }}}

o = :split<Enter>
O = :vsplit<Enter>

[messages:folder=Drafts]
<Enter> = :recall<Enter>

[view]
/ = :toggle-key-passthrough<Enter>/
q = :close<Enter>
O = :open<Enter>
o = :open<Enter>
S = :save<space>
| = :pipe<space>
d = :choose -o y 'Really delete this message' delete-message<Enter>
A = :archive flat<Enter>

<C-y> = :copy-link <space>
<C-l> = :open-link <space>

f = :forward<Enter>
F = :forward<Enter>
Rb = :bounce<space>
Rr = :reply<Enter>
Rq = :reply -aq<Enter>

I = :toggle-headers<Enter>
K = :prev-part<Enter>
J = :next-part<Enter>
<C-n> = :next<Enter>
<C-p> = :prev<Enter>

[view::passthrough]
$noinherit = true
$ex = <A-x>
<Esc> = :toggle-key-passthrough<Enter>

# Composing View, Header field {{{
[compose]
$noinherit = true
$ex = <A-x>
$complete = <C-o>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<Up>  = :prev-field<Enter>
<Down>= :next-field<Enter>

<C-n> = :switch-account -p<Enter>
<C-p> = :switch-account -n<Enter>

<C-x><C-c> = :header cc<Enter>
<C-x>c     = :header cc<Enter>
<C-x><C-b> = :header bcc<Enter>
<C-x>b     = :header bcc<Enter>
<C-x><C-f> = :attach -m<Enter>
<C-x>f     = :attach -m<Enter>
<C-x><C-x> = :encrypt<Enter>
<C-x>x     = :encrypt<Enter>
<C-x><C-s> = :sign<Enter>
<C-x>s     = :sign<Enter>

<C-q> = :choose -o d discard abort -o p postpone postpone<Enter>
<tab> = :next-field<Enter>
<Enter> = :next-field<Enter>
<backtab> = :prev-field<Enter>
# }}}

[compose::editor]
# Keybindings used when the embedded terminal is selected in the compose view
$noinherit = true
$ex = <A-x>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>

[compose::review]
# Keybindings used when reviewing a message to be sent
# Inline comments are used as descriptions on the review screen
y = :send<Enter>                                             # Send
n = :abort<Enter>                                            # Abort (discard message, no confirmation)
s = :sign<Enter>                                             # Sign
x = :encrypt<Enter>                                          # Encrypt
v = :preview<Enter>                                          # View
p = :postpone<Enter>                                         # Postpone
q = :choose -o d discard abort -o p postpone postpone<Enter> # Abort or postpone
e = :edit<Enter>                                             # Edit
a = :attach<space>                                           # Attach
A = :attach -m<Enter>                                        # Attach (interactive)
d = :detach<space>                                           # Detach
D = :multipart -d text/html<Enter>                           # De-HTML
H = :multipart text/html<Enter>                              # HTML

[terminal]
$noinherit = true
$ex = <A-x>
