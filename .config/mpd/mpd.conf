db_file "~/.local/share/mpd/database"
playlist_directory "~/Media/Playlists"
state_file "~/.local/state/mpd/state"
music_directory "~/Music"
auto_update "yes"
max_output_buffer_size "262144"

restore_paused "yes"

# allow only local connections (UNIX domain socket or via TCP) to control
# everything by default
# remote access needs a password
default_permissions "read,player"
local_permissions "read,add,player,control,admin"
host_permissions "localhost read,add,player,control,admin"
password "jo-mpd-admin!@read,add,control,admin"

audio_output {
    type "pulse"
    name "default"
    format "*:*:*"
}

audio_output {
    type "fifo"
    name "preview_fifo"
    path "$XDG_CACHE_HOME/.mpd.fifo"
    format "44100:16:2"
}
