status_path ~/.local/state/pimsync/status

storage private_remote {
    type caldav
    url https://dav.mailbox.org/
    username {
        cmd pass-get mail/mailbox.org user
    }
    password {
        cmd pass-get mail/mailbox.org .
    }
}

storage private_local {
    type vdir/icalendar
    path ~/cal/.private/
}

storage private_contacts_remote {
    type carddav
    url https://dav.mailbox.org
    username {
        cmd pass-get mail/mailbox.org user
    }
    password {
        cmd pass-get mail/mailbox.org .
    }
}

storage private_contacts_local {
    type vdir/vcard
    path ~/cal/.contacts/
}

pair private_contacts {
    storage_a private_contacts_local
    storage_b private_contacts_remote
    collections all
}

pair private {
    storage_a private_local
    storage_b private_remote
    collections all
    conflict_resolution cmd nvim -d
}
