configurations:
  - host: imap.mailbox.org
    tls: true
    port: 993
    usernameCMD: pass-get mail/mailbox.org user
    passwordCMD: pass-get mail/mailbox.org .
    boxes:
      - mailbox: INBOX
        onNewMail: ~/.config/goimapnotify/event.sh private '{{.Alias}}' '{{.Reason}}' '{{.ExistingEmail}}'
  - hostCMD: pass-get uni/1 imap
    tls: true
    port: 993
    usernameCMD: pass-get uni/1 user
    passwordCMD: pass-get uni/1 .
    boxes:
      - mailbox: INBOX
        onNewMail: ~/.config/goimapnotify/event.sh uni '{{.Alias}}' '{{.Reason}}' '{{.ExistingEmail}}'
