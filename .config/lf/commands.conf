# vim: ft=lf

cmd open &{{
    ~/.config/lf/bin/open.sh $fx
}}

# command to set selected file as wallpaper using swww
cmd wallpaper &{{
    wallpaper ${1:-both} $f
}}

# display PWD in window title
# adds every new directory to zoxide
cmd on-cd &{{
   printf "\033]0;lf: ${(D)PWD}\007" > /dev/tty

   # magically return to archive when exiting
   if [[ "$PWD" == "$HOME/Tmp/arc" && -f "$HOME/Tmp/arc/.open.list" ]]; then
       while IFS=$'\0' read -r archive mount; do
           if [[ "$mount" == "$f" ]]; then
               lf -remote "send $id select ${(q)archive}"
               break
           fi
       done < "$HOME/Tmp/arc/.open.list"
   fi
   zoxide add "$PWD"
}}

cmd chmod %{{
    chmod "$@" $fx
    lf -remote "send reload"
}}

cmd chown %{{
    chown "$@" $fx
    lf -remote "send reload"
}}

cmd paste-async &{{
    set -- $(cat ~/.local/share/lf/files)
    mode="$1"
    shift
    case "$mode" in
        copy) cp -rn -- "$@" .;;
        move) mv -n -- "$@" .;;
    esac
    rm ~/.local/share/lf/files
    lf -remote "send $id echo Operation finished."
}}


# Stats about the file {{{
cmd info-mimetype &{{
    type=$(file --brief --mime-type "$f")
    lf -remote "send $id echo ${(q)type}"
}}

cmd disk-usage &{{
    size="$(dust -n 0 -j "$f" | jq '.size')"
    lf -remote "send $id echo ${f:t}: $size"
}}
# }}}

cmd backup &{{
    ~/.config/lf/bin/bak.sh $f
}}

cmd follow-link %{{
    rpath="${f:A}"
    lf -remote "send $id select ${(q)rpath}"
}}

# evaluate a directory and cd to it
cmd cd-eval &{{
    dir="${(e)1}"
    lf -remote "send $id cd ${(q)dir}"
}}

cmd clean-cache %{{
    rm -rf -- "$XDG_CACHE_HOME/lf"
}}

cmd clean-archives &{{
    rm "$HOME/Tmp/arc"
}}

cmd split &{{
    if [ $lf_count -ne 1 ]; then
        count=$((lf_count * 10))
    else
        count=50
    fi
    eval-in-split split "$count" "${(e)@}"
}}

cmd vsplit &{{
    if [ $lf_count -ne 1 ]; then
        count=$((lf_count * 10))
    else
        count=50
    fi
    eval-in-split vsplit "$count" "${(e)@}"
}}

# quit(muscle memory)
cmd q :quit

# Make new Thing {{{
cmd mkdir %{{
    mkdir -p "$@"
    lf -remote "send $id select ${(q)1}"
}}

cmd make-file &{{
    created="$(newf "$@")"
    lf -remote "send $id reload"
    lf -remote "send $id select ${(q)@}"
}}

# symlink a file
cmd link %{{
    ln -s -- "$f" $1
}}

cmd hard-link %{{
    ln -- "$f" "$1"
}}

# "paste" files by creating symlinks
cmd paste-link &{{
    set -- $(cat ~/.local/share/lf/files)
    mode="$1"
    shift
    local -a files=("$@")

    for file in "${files[@]}"; do
        ln -s -- "$file" "${file:t}"
        to_select="$PWD/${file:t}"
        lf -remote "send $id select ${(q)to_select}"
    done

    rm ~/.local/share/lf/files
}}
# }}}

# Manage Trash {{{
# trash smth using gio (moves to ~/.local/share/Trash/files and adds entry)
cmd trash-trash %{{
    ~/.config/lf/bin/trash.sh add $fx
}}

# restores file from gio trash, use in trash directory on file
cmd trash-restore %{{
    ~/.config/lf/bin/trash.sh restore $fx
}}

# empty the entire trash
cmd trash-clear %{{
    printf "Do you really want to empty the Trash? <y/N> "
    read answer
    if [[ "$answer" == "y" ]]
    then
        gio trash --empty
        printf "Trash emptied"
    else
        printf "Trash not emptied"
    fi
}}
# }}}

# Clipboard {{{
# copy file name into clipboard
cmd cp-name &{{
    printf "$f" | wl-copy
}}

# copy file into clipboard for e.g. libreoffice
cmd cp-content &{{
    wl-copy < "$f"
}}

# paste clipboard content
cmd clip-paste &{{
    wl-paste > $1
    if [[ $? -eq 0 ]]
    then
        lf -remote "send $id select ${(q)1}"
        lf -remote "send $id reload"
    fi
}}

# info about file mimetype, same use case as above
cmd clip-info &{{
    mimetypes=($(wl-paste -l || echo))
    lf -remote "send $id echo ${(j:, :)mimetypes:-nothing}"
}}
# }}}

# Integrations {{{
# zoxide
cmd z %{{
    result="$(zoxide query --exclude $PWD $@)"
    lf -remote "send $id cd ${(q)result}"
}}

# zoxide+fzf
cmd zi ${{
    eval-in-split split 30 ~/.config/lf/bin/zoxide-cd.sh
}}

cmd fzf-cd ${{
    eval-in-split split 30 ~/.config/lf/bin/fzf-cd.sh
}}

cmd fzf-select &{{
    eval-in-split split 30 ~/.config/lf/bin/fzf-select.sh
}}

cmd rg-select &{{
    eval-in-split split 30 ~/.config/lf/bin/rg-select.sh
}}
# }}}

# archives {{{
cmd zip &{{
    fx=("${=fx}")
    fx=("${(@)fx#"$PWD/"}")
    if [[ -z "$1" ]]; then
        zipfile="${fx[1]}.zip"
    else
        zipfile="$1"
    fi

    lf -remote "send $id set watch!"
    zip --display-bytes -r "$zipfile" "${fx[@]}" | while IFS="]" read -r prog l; do
        IFS=" " read -r _ cur <<< "$l"
        print -Pv msg "%F{12}\\\\#zip: %F{8}[%F{magenta}${prog:1}%F{8}]%F{white} $cur"
        lf -remote "send $id echo $msg"
    done
    lf -remote "send $id set watch;unselect"
    lf -remote "send $id select ${(q)zipfile}"
}}

cmd tar &{{
    fx=("${=fx}")
    fx=("${(@)fx#"$PWD/"}")
    if [[ -z "$1" ]]; then
        tarfile="${fx[1]}.tar.gz"
    else
        tarfile="$1"
    fi

    lf -remote "send $id set watch!"
    filecount=$(fd --type=f . -- "${fx}" | wc -l)
    curcount=0
    tar cvaf "$tarfile" "${fx[@]}" | while IFS=" " read -r cur; do
        if ((curcount % 3)); then
            print -Pv msg "%F{12}\\\\#tar: %F{8}[%F{magenta}${curcount} / ${filecount}%F{8}]%F{white} $cur"
            lf -remote "send $id echo $msg"
        fi
        ((curcount += 1))
    done
    lf -remote "send $id set watch;unselect"
    lf -remote "send $id select ${(q)tarfile}"
}}

cmd extract &{{
    dest="$1"
    if [[ -n "$dest" ]]; then
        mkdir "$dest"
    else
        dest="."
    fi

    bsdtar -x -C "$dest" -f "$f"
    if [[ -n "$dest" ]]; then
        lf -remote "send $id select ${(q)dest}"
    fi
}}
# }}}

# Images {{{
cmd image-rotate &{{
    angle=${1:-90}; [ -n "$1" ] && shift
    target="${1:-"$f.${angle}deg"}"; [ -n "$1" ] && shift

    magick "$f" -rotate "$angle" "$@" "$target"
    if [[ -n "$target" ]]; then
        lf -remote "send $id select ${(q)target}"
    fi
    lf -remote "send $id redraw"
}}

cmd image-resize &{{
    size=${1:-1920x1080}; [ -n "$1" ] && shift
    target="${1:-"$f.$size"}"; [ -n "$1" ] && shift

    magick "$f" -resize "$size" "$@" "$target"
    lf -remote "send $id select ${(q)target}"
}}

cmd image-magick &{{
    target="$1"; shift

    magick "$f" "$@" "$target"
    lf -remote "send $id select ${(q)target}"
}}
# }}}
