# vim: ft=kitty

# Most of the defaults are arcane, windows or macos-like and generally not that nice
# I try to not use up anything outside of the <C-Esc> keymap layer unless necessary
# TODO: Consider modes for e.g. scrolling, for now less(1) is enough
clear_all_shortcuts yes

# Font & Color {{{

# Basic zooming, the C-a and C-x are actually nicer
map ctrl+escape>plus  change_font_size all +2.0
map ctrl+escape>minus change_font_size all -2.0
map ctrl+escape>ctrl+a  change_font_size all +2.0
map ctrl+escape>ctrl+x change_font_size all -2.0
map ctrl+escape>0 change_font_size all 12.0

map ctrl+escape>c>d set_colors --all --configured ~/.config/kitty/dark.conf
map ctrl+escape>c>l set_colors --all --configured ~/.config/kitty/light.conf

map ctrl+escape>c>o set_background_opacity 1
map ctrl+escape>c>t set_background_opacity 0.8
map ctrl+escape>c>minus set_background_opacity -0.1
map ctrl+escape>c>plus  set_background_opacity +0.1
# }}}
# Scrollback Buffer {{{
# I cannot really live without these, it's good to keep them outside of the prefix
# in other programs these work regardless, since kitty only uses these mappings when scrollback is active
map alt+k scroll_line_up
map alt+j scroll_line_down
map alt+shift+k scroll_home
map alt+shift+j scroll_end
map PageUp scroll_page_up
map PageDown scroll_page_down

# Useful, mirror Vim
map ctrl+escape>[ scroll_to_prompt -1
map ctrl+escape>] scroll_to_prompt +1

# Browse scrollback in a variety of ways
map ctrl+escape>v       show_last_command_output
map ctrl+escape>shift+v show_scrollback
map ctrl+escape>e       launch --stdin-source=@last_cmd_output --location split $EDITOR
map ctrl+escape>shift+e launch --stdin-source=@screen_scrollback --location split $EDITOR
map ctrl+escape>/       search_scrollback

# Clear regions
map ctrl+escape>shift+x clear_terminal scroll active
map ctrl+escape>x       clear_terminal last_command active
# }}}
# Windows {{{
map ctrl+escape>j neighboring_window down
map ctrl+escape>k neighboring_window up
map ctrl+escape>h neighboring_window left
map ctrl+escape>l neighboring_window right

map ctrl+escape>shift+j move_window down
map ctrl+escape>shift+k move_window up
map ctrl+escape>shift+h move_window left
map ctrl+escape>shift+l move_window right

# FIXME: Sadly this doesn't seem to be automatic like Vim's <C-w>[HJKL]
map ctrl+escape>control+j layout_action move_to_screen_edge bottom
map ctrl+escape>control+k layout_action move_to_screen_edge top
map ctrl+escape>control+h layout_action move_to_screen_edge left
map ctrl+escape>control+l layout_action move_to_screen_edge right

map ctrl+escape>w previous_window
map ctrl+escape>d detach_window
# like :only in Vim, a bit of a HACK, I do not really use tabs so this should be fine
map ctrl+escape>o detach_window new-tab

# Open new split
map ctrl+escape>s       launch --cwd=current
map ctrl+escape>shift+s launch --cwd=current --location=vsplit
map ctrl+escape>ctrl+s  launch --cwd=current --location=hsplit

# Like the sway-level enter map
# Generally this is probably more useful than Leader>S, because OS-Windows are easier to manage
map ctrl+escape>enter launch --type=os-window --cwd=current
map ctrl+escape>space launch --type=os-window --cwd=current $SHELL -ic lf

# TODO: do I ever use this?
map ctrl+escape>q close_window_with_confirmation ignore-shell
# }}}
# Sessions {{{
map ctrl+escape>% save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions
map ctrl+escape>@ goto_session ~/.local/share/kitty/sessions
map ctrl+escape>* goto_session
map ctrl+escape>) goto_session +1
map ctrl+escape>( goto_session -1
#}}}
# Get Text on Screen {{{
action_alias hints kitten hints --hints-background-color=yellow

# operate on content
map ctrl+escape>g>p hints --type path --program -
map ctrl+escape>g>l hints --type line --program -
map ctrl+escape>g>u hints --type url
map ctrl+escape>g>x hints --type hyperlink
map ctrl+escape>g>w hints --type word --program -
map ctrl+escape>g>shift+w hints --type word

map ctrl+escape>f kitten chose-file.py
# }}}

map ctrl+escape>8 remote_control resize-os-window --width 80 --height 25

# Input
map ctrl+escape>u kitten unicode_input --tab name
map ctrl+escape>: kitty_shell

# Copy and Pasting {{{
# These keymaps are intentionally long to discourage overuse
# C-c and C-v have way more useful meanings otherwise and S-C- is annoying to press
map ctrl+escape>p       paste_from_clipboard
map ctrl+escape>shift+p paste_from_selection
map ctrl+escape>y       copy_to_clipboard
map ctrl+escape>shift+y copy_last_command_output
#}}}

# Suspend a process and send it to background immediately
map ctrl+escape>z kitten background-proc.py
