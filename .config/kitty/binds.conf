# vim: ft=kitty

clear_all_shortcuts yes

# font
map ctrl+escape>plus change_font_size all +1.0
map ctrl+escape>- change_font_size all -1.0
map ctrl+escape>0 change_font_size all 12.0

# clear regions
map ctrl+escape>x       clear_terminal scroll active
map ctrl+escape>shift+x clear_terminal last_command active

# movement
map alt+k scroll_line_up
map alt+j scroll_line_down
map alt+shift+k scroll_home
map alt+shift+j scroll_end

# windows
map ctrl+escape>j neighboring_window down
map ctrl+escape>k neighboring_window up
map ctrl+escape>h neighboring_window left
map ctrl+escape>l neighboring_window right

map ctrl+escape>shift+j move_window down
map ctrl+escape>shift+k move_window up
map ctrl+escape>shift+h move_window left
map ctrl+escape>shift+l move_window right

map ctrl+escape>c>d set_colors --configured ~/.config/kitty/dark.conf
map ctrl+escape>c>l set_colors --configured ~/.config/kitty/light.conf

map ctrl+escape>w       previous_window
map ctrl+escape>d       detach_window

action_alias hints kitten hints --hints-background-color=yellow

# operate on content
map ctrl+escape>g>p hints --type path --program -
map ctrl+escape>g>l hints --type line --program -
map ctrl+escape>g>u hints --type url
map ctrl+escape>g>x hints --type hyperlink

# HACK: for a double line shell prompt
map ctrl+escape>[ scroll_to_prompt -1 -1
map ctrl+escape>] scroll_to_prompt 1 -1

map ctrl+escape>v show_last_command_output
map ctrl+escape>e launch --stdin-source=@last_cmd_output $EDITOR

# input
map ctrl+escape>u kitten unicode_input --tab name

# pasting
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

map ctrl+escape>z kitten background-proc.py
