# vim: ft=kitty

# Most of the defaults are arcane, windows or macos-like and generally not that nice
# I try to not use up anything outside of the <C-Esc> keymap layer unless necessary
clear_all_shortcuts yes

# Font & Color {{{
map ctrl+escape>plus change_font_size all +2.0
map ctrl+escape>- change_font_size all -2.0
map ctrl+escape>0 change_font_size all 12.0

map ctrl+escape>c>d set_colors --configured ~/.config/kitty/dark.conf
map ctrl+escape>c>l set_colors --configured ~/.config/kitty/light.conf
# }}}

# Scrollback Buffer {{{
map alt+k scroll_line_up
map alt+j scroll_line_down
map alt+shift+k scroll_home
map alt+shift+j scroll_end

map ctrl+escape>[ scroll_to_prompt -1
map ctrl+escape>] scroll_to_prompt +1

map ctrl+escape>v       show_last_command_output
map ctrl+escape>shift+v show_scrollback
map ctrl+escape>e       launch --stdin-source=@last_cmd_output --location hsplit $EDITOR
map ctrl+escape>shift+e launch --stdin-source=@screen_scrollback --location hsplit $EDITOR

# clear regions
map ctrl+escape>shift+x clear_terminal scroll active
map ctrl+escape>x       clear_terminal last_command active

map ctrl+escape>i kitten insert-last.py
# }}}

# Windows {{{
map ctrl+escape>j neighboring_window down
map ctrl+escape>k neighboring_window up
map ctrl+escape>h neighboring_window left
map ctrl+escape>l neighboring_window right

map ctrl+escape>shift+j move_window down
map ctrl+escape>shift+k move_window up
map ctrl+escape>shift+h move_window left
map ctrl+escape>shift+l move_window right

map ctrl+escape>w previous_window
map ctrl+escape>d detach_window
# like :only in Vim, a bit of a HACK, I do not really use tabs so this should be fine
map ctrl+escape>o detach_window new-tab
# }}}

# Get Text on Screen {{{
action_alias hints kitten hints --hints-background-color=yellow

# operate on content
map ctrl+escape>g>p hints --type path --program -
map ctrl+escape>g>l hints --type line --program -
map ctrl+escape>g>u hints --type url
map ctrl+escape>g>x hints --type hyperlink
# }}}

# Input
map ctrl+escape>u kitten unicode_input --tab name

# Copy and Pasting
# These keymaps are intentionally long to discourage overuse
map ctrl+escape>p paste_from_clipboard
map ctrl+escape>y copy_to_clipboard

# Suspend a process and send it to background immediately
map ctrl+escape>z kitten background-proc.py
